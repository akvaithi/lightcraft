# Dev tooling, not part of the product or its workspace: trains the AI Denoise network with burn
# (pure Rust, MIT OR Apache-2.0) and writes the `.lcdn` model the app loads.
[package]
name = "lightcraft-denoise-train"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
lightcraft-denoise = { path = "../../crates/denoise" }
lightcraft-raw = { path = "../../crates/raw" }
lightcraft-raster = { path = "../../crates/raster" }
lightcraft-scenes = { path = "../../crates/scenes" }
lightcraft-color = { path = "../../crates/color" }
burn = { version = "0.21", default-features = false, features = ["std", "autodiff", "wgpu"] }
serde_json = "1"
rayon = "1"

[features]
## Train on NVIDIA GPUs through CUDA instead of wgpu (needs the CUDA toolkit).
cuda = ["burn/cuda"]

[profile.release]
debug = "line-tables-only"
